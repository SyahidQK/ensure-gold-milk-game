<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -34 80 68">
  <!-- butterfly that flaps its wings (animation runs inside the image) -->
  <style>
    .w { transform-box: fill-box; animation: flap .28s ease-in-out infinite alternate; }
    .l { transform-origin: right center; }
    .r { transform-origin: left center; }
    @keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(.25); } }
  </style>
  <g class="w l">
    <path d="M-2 -2 C-18 -34 -40 -26 -36 -8 C-34 2 -16 2 -2 -2Z" fill="#ffb300" stroke="#5d3a00" stroke-width="2"/>
    <path d="M-2 2 C-22 6 -32 24 -18 28 C-8 30 -4 16 -2 2Z" fill="#ff7043" stroke="#5d3a00" stroke-width="2"/>
    <circle cx="-24" cy="-14" r="4" fill="#fff8e1"/>
  </g>
  <g class="w r">
    <path d="M2 -2 C18 -34 40 -26 36 -8 C34 2 16 2 2 -2Z" fill="#ffb300" stroke="#5d3a00" stroke-width="2"/>
    <path d="M2 2 C22 6 32 24 18 28 C8 30 4 16 2 2Z" fill="#ff7043" stroke="#5d3a00" stroke-width="2"/>
    <circle cx="24" cy="-14" r="4" fill="#fff8e1"/>
  </g>
  <ellipse cx="0" cy="2" rx="3" ry="14" fill="#3e2723"/>
  <path d="M-1 -12 C-4 -20 -8 -24 -10 -26 M1 -12 C4 -20 8 -24 10 -26" stroke="#3e2723" stroke-width="1.5" fill="none"/>
</svg>

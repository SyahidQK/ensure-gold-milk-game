<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Malaysian countryside dairy farm: static layers (clouds, banana trees, grass and butterflies animate on top) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fa9f5"/>
      <stop offset=".45" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#e2f5ff"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff9dc" stop-opacity="1"/>
      <stop offset=".25" stop-color="#fff3b8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff3b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fcdd0"/>
      <stop offset="1" stop-color="#c3e2e2"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fb38e"/>
      <stop offset="1" stop-color="#8fc7a2"/>
    </linearGradient>
    <linearGradient id="tea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa35a"/>
      <stop offset="1" stop-color="#3b8f49"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="field1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ad853"/>
      <stop offset="1" stop-color="#72c040"/>
    </linearGradient>
    <linearGradient id="field2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fca46"/>
      <stop offset="1" stop-color="#55a832"/>
    </linearGradient>
    <linearGradient id="field3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63b83a"/>
      <stop offset="1" stop-color="#3f9327"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d49a5c"/>
      <stop offset="1" stop-color="#b57a3e"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5432f"/>
      <stop offset="1" stop-color="#7c2c1f"/>
    </linearGradient>
    <linearGradient id="hayFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d77a"/>
      <stop offset="1" stop-color="#d9a93f"/>
    </linearGradient>

    <!-- tea-plantation rows on the near hills (Cameron Highlands) -->
    <path id="teaRow" d="M0 650 C200 590 380 600 560 640 C700 670 800 640 960 630 C1140 620 1300 660 1460 640 C1640 618 1780 600 1920 620" fill="none"/>
    <clipPath id="teaClip">
      <path d="M0 650 C200 590 380 600 560 640 C700 670 800 640 960 630 C1140 620 1300 660 1460 640 C1640 618 1780 600 1920 620 L1920 760 L0 760Z"/>
    </clipPath>

    <!-- white farm fence tile -->
    <pattern id="fence" width="64" height="60" patternUnits="userSpaceOnUse">
      <rect x="0" y="12" width="64" height="8" rx="2" fill="#fff"/>
      <rect x="0" y="32" width="64" height="8" rx="2" fill="#fff"/>
      <rect x="4" y="0" width="11" height="60" rx="3" fill="#fff"/>
      <rect x="4" y="52" width="11" height="8" fill="#d6e6d0"/>
    </pattern>

    <!-- round hay bale, base at y=0 -->
    <symbol id="hay" overflow="visible">
      <ellipse cx="0" cy="0" rx="74" ry="10" fill="#000" opacity=".12"/>
      <rect x="-60" y="-84" width="96" height="84" rx="10" fill="#e8bd55"/>
      <path d="M-60 -60 H36 M-60 -38 H36 M-60 -16 H36" stroke="#c99a35" stroke-width="3"/>
      <ellipse cx="36" cy="-42" rx="30" ry="42" fill="url(#hayFace)" stroke="#c99a35" stroke-width="3"/>
      <ellipse cx="36" cy="-42" rx="18" ry="26" fill="none" stroke="#c99a35" stroke-width="2.5"/>
      <ellipse cx="36" cy="-42" rx="7" ry="11" fill="none" stroke="#c99a35" stroke-width="2"/>
    </symbol>
  </defs>

  <!-- sky + sun -->
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1520" cy="150" r="300" fill="url(#sun)"/>
  <circle cx="1520" cy="150" r="70" fill="#fffbe6"/>

  <!-- far misty ridges -->
  <path d="M0 540 C150 470 260 430 400 470 C520 505 600 420 760 400 C900 380 1000 460 1120 450 C1260 438 1340 380 1500 400 C1650 420 1760 470 1920 450 L1920 720 L0 720Z" fill="url(#far)"/>

  <!-- distant Malaysian city skyline, hazy -->
  <g fill="#9cbccd" opacity=".85">
    <rect x="120" y="500" width="34" height="100"/>
    <rect x="160" y="470" width="26" height="130"/>
    <rect x="192" y="520" width="40" height="80"/>
    <!-- twin towers -->
    <path d="M262 600 V470 L270 450 L274 420 L278 450 L286 470 V600Z"/>
    <path d="M300 600 V470 L308 450 L312 420 L316 450 L324 470 V600Z"/>
    <rect x="284" y="505" width="18" height="6"/>
    <!-- tower with antenna -->
    <rect x="354" y="490" width="22" height="110"/>
    <path d="M365 490 V430" stroke="#9cbccd" stroke-width="4"/>
    <circle cx="365" cy="482" r="12"/>
    <rect x="392" y="510" width="44" height="90"/>
    <rect x="444" y="535" width="30" height="65"/>
    <rect x="1600" y="520" width="30" height="80"/>
    <rect x="1636" y="495" width="24" height="105"/>
    <rect x="1666" y="530" width="40" height="70"/>
  </g>
  <g fill="#cfe1ea" opacity=".7">
    <rect x="125" y="510" width="6" height="4"/><rect x="138" y="530" width="6" height="4"/>
    <rect x="166" y="490" width="5" height="4"/><rect x="176" y="520" width="5" height="4"/>
    <rect x="398" y="525" width="6" height="4"/><rect x="414" y="545" width="6" height="4"/>
  </g>

  <!-- mid ridges -->
  <path d="M0 600 C120 540 240 520 360 545 C480 570 560 500 700 490 C840 480 920 545 1060 540 C1200 535 1300 480 1440 490 C1580 500 1700 560 1920 530 L1920 740 L0 740Z" fill="url(#mid)"/>
  <rect x="0" y="540" width="1920" height="90" fill="url(#mist)"/>

  <!-- tea-plantation hills -->
  <path d="M0 650 C200 590 380 600 560 640 C700 670 800 640 960 630 C1140 620 1300 660 1460 640 C1640 618 1780 600 1920 620 L1920 760 L0 760Z" fill="url(#tea)"/>
  <g clip-path="url(#teaClip)" stroke="#378243" stroke-width="7" stroke-linecap="round" opacity=".55">
    <use href="#teaRow" xlink:href="#teaRow" transform="translate(0 16)"/>
    <use href="#teaRow" xlink:href="#teaRow" transform="translate(0 34)"/>
    <use href="#teaRow" xlink:href="#teaRow" transform="translate(0 52)"/>
    <use href="#teaRow" xlink:href="#teaRow" transform="translate(0 70)"/>
    <use href="#teaRow" xlink:href="#teaRow" transform="translate(0 88)"/>
    <use href="#teaRow" xlink:href="#teaRow" transform="translate(0 106)"/>
  </g>
  <g clip-path="url(#teaClip)" stroke="#78c47a" stroke-width="3" stroke-linecap="round" opacity=".45">
    <use href="#teaRow" xlink:href="#teaRow" transform="translate(0 12)"/>
    <use href="#teaRow" xlink:href="#teaRow" transform="translate(0 30)"/>
    <use href="#teaRow" xlink:href="#teaRow" transform="translate(0 48)"/>
    <use href="#teaRow" xlink:href="#teaRow" transform="translate(0 66)"/>
    <use href="#teaRow" xlink:href="#teaRow" transform="translate(0 84)"/>
  </g>

  <!-- back pasture -->
  <path d="M0 700 C300 660 620 690 960 700 C1300 710 1600 670 1920 690 L1920 1080 L0 1080Z" fill="url(#field1)"/>

  <!-- white fences -->
  <rect x="0" y="704" width="600" height="60" fill="url(#fence)"/>
  <rect x="1310" y="694" width="610" height="60" fill="url(#fence)"/>

  <!-- traditional kampung wooden house on stilts -->
  <g>
    <ellipse cx="1690" cy="792" rx="170" ry="14" fill="#000" opacity=".12"/>
    <!-- stilts -->
    <g fill="#7a4b22">
      <rect x="1578" y="712" width="12" height="80"/>
      <rect x="1630" y="712" width="12" height="80"/>
      <rect x="1690" y="712" width="12" height="80"/>
      <rect x="1748" y="712" width="12" height="80"/>
      <rect x="1798" y="712" width="12" height="80"/>
    </g>
    <!-- floor -->
    <rect x="1560" y="700" width="262" height="16" rx="3" fill="#8a5a2b"/>
    <!-- walls with planks -->
    <rect x="1574" y="590" width="234" height="112" fill="url(#wood)"/>
    <g stroke="#a86d33" stroke-width="2" opacity=".7">
      <path d="M1594 590 V702 M1614 590 V702 M1634 590 V702 M1654 590 V702 M1674 590 V702 M1694 590 V702 M1714 590 V702 M1734 590 V702 M1754 590 V702 M1774 590 V702 M1794 590 V702"/>
    </g>
    <!-- windows with open shutters -->
    <g>
      <rect x="1596" y="616" width="40" height="44" fill="#ffe7a3"/>
      <path d="M1616 616 V660" stroke="#8a5a2b" stroke-width="3"/>
      <rect x="1582" y="614" width="14" height="48" fill="#6b3d1a"/>
      <rect x="1636" y="614" width="14" height="48" fill="#6b3d1a"/>
      <rect x="1744" y="616" width="40" height="44" fill="#ffe7a3"/>
      <path d="M1764 616 V660" stroke="#8a5a2b" stroke-width="3"/>
      <rect x="1730" y="614" width="14" height="48" fill="#6b3d1a"/>
      <rect x="1784" y="614" width="14" height="48" fill="#6b3d1a"/>
    </g>
    <!-- door -->
    <rect x="1672" y="620" width="40" height="82" rx="3" fill="#6b3d1a"/>
    <circle cx="1704" cy="664" r="3" fill="#e8bd55"/>
    <!-- stairs -->
    <g fill="#8a5a2b">
      <path d="M1672 716 L1648 792 H1660 L1684 716Z"/>
      <path d="M1712 716 L1688 792 H1700 L1724 716Z"/>
      <rect x="1666" y="732" width="46" height="6"/>
      <rect x="1660" y="752" width="46" height="6"/>
      <rect x="1654" y="772" width="46" height="6"/>
    </g>
    <!-- steep Malay roof with gable decoration -->
    <path d="M1540 600 L1691 476 L1842 600 Z" fill="url(#roof)"/>
    <path d="M1600 594 L1691 516 L1782 594 Z" fill="#c76a3d"/>
    <g stroke="#8a3a22" stroke-width="3" opacity=".8">
      <path d="M1640 594 L1691 550 L1742 594"/>
      <path d="M1691 520 V594"/>
    </g>
    <path d="M1536 602 L1691 472 L1846 602" fill="none" stroke="#5a1f14" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M1691 472 L1680 450 M1691 472 L1702 450" stroke="#5a1f14" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- hay bales -->
  <use href="#hay" xlink:href="#hay" transform="translate(500 772) scale(.7)"/>
  <use href="#hay" xlink:href="#hay" transform="translate(1388 778) scale(.75)"/>
  <use href="#hay" xlink:href="#hay" transform="translate(1872 840) scale(.6)"/>

  <!-- middle pasture -->
  <path d="M0 820 C380 760 760 830 1120 810 C1440 790 1700 760 1920 790 L1920 1080 L0 1080Z" fill="url(#field2)"/>
  <g stroke="#8fd655" stroke-width="10" fill="none" opacity=".35" stroke-linecap="round">
    <path d="M0 880 C380 830 760 890 1120 870 C1440 850 1700 830 1920 850"/>
    <path d="M0 930 C380 880 760 940 1120 920 C1440 900 1700 880 1920 900"/>
  </g>

  <!-- dairy cows are animated separately (js/farm-cows.js) -->

  <!-- front pasture -->
  <path d="M0 960 C420 910 900 990 1300 960 C1580 940 1780 920 1920 940 L1920 1080 L0 1080Z" fill="url(#field3)"/>

  <!-- small wild flowers -->
  <g fill="#fff">
    <circle cx="640" cy="1010" r="5"/><circle cx="700" cy="1040" r="4"/><circle cx="1240" cy="1000" r="5"/>
    <circle cx="1300" cy="1046" r="4"/><circle cx="880" cy="1050" r="4"/><circle cx="1080" cy="1020" r="5"/>
  </g>
  <g fill="#ffd84d">
    <circle cx="640" cy="1010" r="2"/><circle cx="1240" cy="1000" r="2"/><circle cx="1080" cy="1020" r="2"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb8f5"/>
      <stop offset=".55" stop-color="#a9dcfb"/>
      <stop offset="1" stop-color="#d9f1ff"/>
    </linearGradient>
    <linearGradient id="mtnFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d9fd6"/>
      <stop offset="1" stop-color="#a8c2ea"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f73b8"/>
      <stop offset="1" stop-color="#7b9ad6"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ad84f"/>
      <stop offset="1" stop-color="#6cbb35"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc83b"/>
      <stop offset="1" stop-color="#4f9d26"/>
    </linearGradient>
    <linearGradient id="hill3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd246"/>
      <stop offset="1" stop-color="#5aa82c"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbe6" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fffbe6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="960" cy="330" r="420" fill="url(#sun)"/>

  <!-- clouds -->
  <g fill="#fff" opacity=".95">
    <g transform="translate(140 110)"><ellipse cx="0" cy="0" rx="90" ry="34"/><ellipse cx="60" cy="-18" rx="60" ry="38"/><ellipse cx="120" cy="4" rx="70" ry="28"/></g>
    <g transform="translate(1500 150)"><ellipse cx="0" cy="0" rx="110" ry="36"/><ellipse cx="80" cy="-24" rx="70" ry="44"/><ellipse cx="170" cy="0" rx="80" ry="30"/></g>
    <g transform="translate(1180 70) scale(.7)"><ellipse cx="0" cy="0" rx="90" ry="30"/><ellipse cx="60" cy="-20" rx="60" ry="36"/><ellipse cx="120" cy="2" rx="60" ry="24"/></g>
    <g transform="translate(560 200) scale(.6)"><ellipse cx="0" cy="0" rx="90" ry="30"/><ellipse cx="60" cy="-20" rx="60" ry="36"/><ellipse cx="120" cy="2" rx="60" ry="24"/></g>
  </g>

  <!-- far mountains -->
  <path d="M0 560 L180 420 L320 500 L520 360 L700 480 L860 400 L1040 500 L1220 380 L1420 470 L1600 360 L1780 450 L1920 400 L1920 700 L0 700Z" fill="url(#mtnFar)"/>
  <!-- near mountains -->
  <path d="M0 600 L120 520 L260 380 L360 470 L460 430 L620 600 L0 700Z" fill="url(#mtn)"/>
  <path d="M260 380 L300 430 L280 440 L330 470 L360 470 L310 420Z" fill="#c9d9f3" opacity=".7"/>
  <path d="M1280 620 L1460 440 L1560 520 L1700 400 L1920 560 L1920 700 L1280 700Z" fill="url(#mtn)"/>
  <path d="M1700 400 L1740 440 L1720 450 L1770 480 L1790 470 L1740 430Z" fill="#c9d9f3" opacity=".7"/>

  <!-- tree line -->
  <g fill="#3d8a3a">
    <ellipse cx="60" cy="640" rx="60" ry="34"/><ellipse cx="150" cy="630" rx="50" ry="40"/><ellipse cx="240" cy="645" rx="60" ry="30"/>
    <ellipse cx="1660" cy="640" rx="60" ry="30"/><ellipse cx="1760" cy="630" rx="70" ry="38"/><ellipse cx="1870" cy="642" rx="70" ry="30"/>
  </g>

  <!-- rolling hills -->
  <path d="M0 640 C300 590 640 620 960 640 C1300 660 1600 600 1920 630 L1920 1080 L0 1080Z" fill="url(#hill1)"/>
  <path d="M0 760 C360 690 760 760 1100 740 C1420 720 1680 680 1920 720 L1920 1080 L0 1080Z" fill="url(#hill2)"/>
  <!-- field stripes -->
  <g stroke="#a6dc62" stroke-width="10" fill="none" opacity=".45">
    <path d="M0 820 C400 770 800 830 1200 800 C1500 780 1720 760 1920 780"/>
    <path d="M0 880 C400 830 820 890 1220 860 C1520 840 1740 820 1920 840"/>
  </g>
  <path d="M0 900 C420 850 900 930 1300 900 C1580 880 1760 860 1920 880 L1920 1080 L0 1080Z" fill="url(#hill3)"/>

  <!-- barn -->
  <g transform="translate(1720 600)">
    <rect x="0" y="20" width="110" height="70" fill="#b8322a"/>
    <path d="M-8 24 L55 -14 L118 24Z" fill="#7c2a2a"/>
    <rect x="40" y="48" width="30" height="42" fill="#fff"/>
    <path d="M40 48 L70 90 M70 48 L40 90" stroke="#b8322a" stroke-width="4"/>
  </g>

  <!-- flowers -->
  <g fill="#fff" opacity=".9">
    <circle cx="140" cy="1010" r="6"/><circle cx="210" cy="1040" r="5"/><circle cx="420" cy="990" r="5"/>
    <circle cx="1500" cy="1000" r="6"/><circle cx="1620" cy="1040" r="5"/><circle cx="1780" cy="980" r="6"/>
    <circle cx="1860" cy="1030" r="5"/><circle cx="330" cy="1060" r="5"/><circle cx="1400" cy="1060" r="5"/>
  </g>
  <g fill="#ffd84d">
    <circle cx="140" cy="1010" r="2"/><circle cx="1500" cy="1000" r="2"/><circle cx="1780" cy="980" r="2"/>
  </g>
</svg>
